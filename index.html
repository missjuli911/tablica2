  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сравнение инструментов и позиционирование TL: Ключ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3564EB;
      --primary-light: #eff4fe;
      --primary-border: #9cb6f7;
      --orange-accent: #EA580C;
      --orange-bg: #fff7ed;
      --orange-border: #fed7aa;
      --text-dark: #323537;
      --text-muted: #87898A;
      --bg-page: #ffffff;
      --bg-card: #ffffff;
      --border: #e2e8f0;
      --radius-lg: 16px;
      --radius-md: 12px;
      --shadow: 0 4px 18px -2px rgba(50, 53, 55, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-dark);
      font-size: 16px;
      line-height: 1.5;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .widget {
      background: var(--bg-card);
      width: 100%;
      max-width: 840px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 30px 26px;
      box-shadow: var(--shadow);
      height: fit-content;
    }
    .hint-text {
      font-size: 14px;
      font-style: italic;
      font-weight: 400;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.45;
    }
    .grid-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 620px) {
      .grid-tools { grid-template-columns: 1fr; }
    }
    .tool-btn {
      font-family: 'Roboto', sans-serif;
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tool-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .tool-btn.active {
      background: var(--primary-light);
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }
    .tool-btn.full-width {
      grid-column: 1 / -1;
      background: #fafcff;
      border-color: var(--primary-border);
    }
    .tool-btn.full-width.active {
      background: var(--primary-light);
      border-color: var(--primary);
    }
    .tool-thumb {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: contain;
      background: #fff;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tool-content {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .tool-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-dark);
    }
    .tool-btn.active .tool-title {
      color: var(--primary);
    }
    .tool-sub {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.35;
    }
    .tool-btn.active .tool-sub {
      color: var(--primary);
    }
    .detail-card {
      display: none;
      border-top: 1px solid var(--border);
      padding-top: 24px;
      margin-top: 24px;
    }
    .detail-card.show {
      display: block;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .detail-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .detail-img {
      width: 68px;
      height: 68px;
      border-radius: 12px;
      object-fit: contain;
      background: #fff;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .detail-title {
      font-size: 22px;
      font-weight: 900;
      color: var(--primary);
    }
    .info-sections {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .info-block {
      border-radius: var(--radius-md);
      padding: 18px 20px;
    }
    .info-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .info-block.limits {
      background: var(--orange-bg);
      border: 1px solid var(--orange-border);
      border-left: 5px solid var(--orange-accent);
    }
    .info-block.limits .info-label {
      color: var(--orange-accent);
    }
    .info-block.limits .info-text {
      color: var(--text-dark);
      font-size: 16px;
      line-height: 1.55;
      font-weight: 400;
    }
    .info-block.positioning {
      background: #fbfdff;
      border: 1px solid var(--primary-border);
      border-left: 5px solid var(--primary);
    }
    .info-block.positioning .info-label {
      color: var(--primary);
    }
    .info-block.positioning .info-text {
      font-size: 16px;
      line-height: 1.55;
      color: var(--text-dark);
    }
    .info-list {
      margin-top: 8px;
      padding-left: 20px;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-dark);
    }
    .info-list li {
      margin-bottom: 5px;
    }
  </style>
</head>

    function selectTool(keyName, btnElement) {
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      const item = data[keyName];
      const card = document.getElementById('detailCard');
      const posContent = item.positioningHtml 
        ? item.positioningHtml 
        : `<p class="info-text">${item.positioning}</p>`;

      card.innerHTML = `
        <div class="detail-header">
          <img src="${item.img}" alt="${item.title}" class="detail-img">
          <div class="detail-title">${item.title}</div>
        </div>
        <div class="info-sections">
          <div class="info-block limits">
            <div class="info-label">Ограничения для отеля</div>
            <div class="info-text">${item.limits}</div>
          </div>
          <div class="info-block positioning">
            <div class="info-label">Как позиционировать TL: Ключ в сравнении</div>
            ${posContent}
          </div>
        </div>
      `;

      card.classList.add('show');
